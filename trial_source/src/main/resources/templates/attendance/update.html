<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>
			勤怠管理
			<small>( [[${attendanceForm.userName}]] )</small>
		</h2>

		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2>
				<small>
					途中退校日：[[${attendanceForm.dispLeaveDate}]]
				</small>
			</h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post">

				<div style="overflow-x: auto;">

					<table
						class="table table-hover dataTable no-footer"
						style="min-width: 1200px;">

						<thead>
							<tr>

								<th class="w140">
									日付
								</th>

								<th class="w300">
									コース内容
								</th>

								<!-- Task28 二子石万葉 定時ボタン -->
								
								<th style="width: 80px; min-width: 80px;">
								</th>

								<th style="width: 150px; min-width: 150px;">
									出勤
								</th>

								<th style="width: 150px; min-width: 150px;">
									退勤
								</th>

								<th class="w80">
									中抜け時間
								</th>

								<th class="w70">
									ステータス
								</th>

								<th class="w240">
									備考
								</th>

							</tr>
						</thead>

						<tbody>

							<th:block
								th:each="dailyAttendanceForm, stat : ${attendanceForm.attendanceList}">

								<tr>

									<!-- hidden -->
									<th:block>

										<input
											type="hidden"
											th:name="|attendanceList[${stat.index}].isToday|"
											th:value="${dailyAttendanceForm.isToday}" />

										<input
											type="hidden"
											th:name="|attendanceList[${stat.index}].studentAttendanceId|"
											th:value="${dailyAttendanceForm.studentAttendanceId}" />

										<input
											type="hidden"
											th:name="|attendanceList[${stat.index}].trainingDate|"
											th:value="${dailyAttendanceForm.trainingDate}" />

										<input
											type="hidden"
											th:name="|attendanceList[${stat.index}].dispTrainingDate|"
											th:value="${dailyAttendanceForm.dispTrainingDate}" />

										<input
											type="hidden"
											th:name="|attendanceList[${stat.index}].sectionName|"
											th:value="${dailyAttendanceForm.sectionName}" />

										<input
											type="hidden"
											th:name="|attendanceList[${stat.index}].statusDispName|"
											th:value="${dailyAttendanceForm.statusDispName}" />

									</th:block>

									<!-- 日付 -->
									<td class="w140">
										[[${dailyAttendanceForm.dispTrainingDate}]]
									</td>

									<!-- コース内容 -->
									<td class="w300">
										[[${dailyAttendanceForm.sectionName}]]
									</td>

									<!-- Task28 二子石万葉 定時ボタン -->
									
									<td
										style="
											width: 80px;
											min-width: 80px;
											white-space: nowrap;
										">

										<input
											type="button"
											value="定時"
											class="btn btn-success default-button" />

									</td>

									<!-- Task26 二子石万葉 出勤時間 -->
									<td
										style="
											width: 150px;
											min-width: 150px;
											white-space: nowrap;
										">

										<div
											style="
												display: flex !important;
												flex-direction: row !important;
												flex-wrap: nowrap !important;
												align-items: center !important;
												justify-content: flex-start;
												gap: 5px;
												width: 145px;
												white-space: nowrap;
											">

											<select
												th:name="|attendanceList[${stat.index}].trainingStartTimeHour|"
												class="form-control"
												style="
													display: inline-block !important;
													width: 60px !important;
													min-width: 60px !important;
													max-width: 60px !important;
													flex: 0 0 60px !important;
													margin: 0 !important;
												">

												<option
													th:each="hour : ${attendanceForm.hourMap}"
													th:value="${hour.key}"
													th:selected="${hour.key == dailyAttendanceForm.trainingStartTimeHour}">

													[[${hour.value}]]

												</option>

											</select>

											<span
												style="
													display: inline-block;
													flex: 0 0 auto;
													margin: 0;
												">
												：
											</span>

											<select
												th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|"
												class="form-control"
												style="
													display: inline-block !important;
													width: 60px !important;
													min-width: 60px !important;
													max-width: 60px !important;
													flex: 0 0 60px !important;
													margin: 0 !important;
												">

												<option
													th:each="minute : ${attendanceForm.minuteMap}"
													th:value="${minute.key}"
													th:selected="${minute.key == dailyAttendanceForm.trainingStartTimeMinute}">

													[[${minute.value}]]

												</option>

											</select>

										</div>

									</td>

									<!-- Task26 二子石万葉 退勤時間 -->
									<td
										style="
											width: 150px;
											min-width: 150px;
											white-space: nowrap;
										">

										<div
											style="
												display: flex !important;
												flex-direction: row !important;
												flex-wrap: nowrap !important;
												align-items: center !important;
												justify-content: flex-start;
												gap: 5px;
												width: 145px;
												white-space: nowrap;
											">

											<select
												th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
												class="form-control"
												style="
													display: inline-block !important;
													width: 60px !important;
													min-width: 60px !important;
													max-width: 60px !important;
													flex: 0 0 60px !important;
													margin: 0 !important;
												">

												<option
													th:each="hour : ${attendanceForm.hourMap}"
													th:value="${hour.key}"
													th:selected="${hour.key == dailyAttendanceForm.trainingEndTimeHour}">

													[[${hour.value}]]

												</option>

											</select>

											<span
												style="
													display: inline-block;
													flex: 0 0 auto;
													margin: 0;
												">
												：
											</span>

											<select
												th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|"
												class="form-control"
												style="
													display: inline-block !important;
													width: 60px !important;
													min-width: 60px !important;
													max-width: 60px !important;
													flex: 0 0 60px !important;
													margin: 0 !important;
												">

												<option
													th:each="minute : ${attendanceForm.minuteMap}"
													th:value="${minute.key}"
													th:selected="${minute.key == dailyAttendanceForm.trainingEndTimeMinute}">

													[[${minute.value}]]

												</option>

											</select>

										</div>

									</td>

									<!-- 中抜け時間 -->
									<td class="w80">

										<select
											th:name="|attendanceList[${stat.index}].blankTime|"
											class="form-control">

											<option
												th:each="blankTime : ${attendanceForm.blankTimes}"
												th:value="${blankTime.key}"
												th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">

												[[${blankTime.value}]]

											</option>

										</select>

									</td>

									<!-- ステータス -->
									<td class="w70">
										[[${dailyAttendanceForm.statusDispName}]]
									</td>

									<!-- 備考 -->
									<td class="w240">

										<input
											type="text"
											th:name="|attendanceList[${stat.index}].note|"
											th:value="${dailyAttendanceForm.note}"
											class="form-control" />

									</td>

								</tr>

							</th:block>

						</tbody>

					</table>

				</div>

				<div class="form-group">

					<th:block
						th:if="${session.loginUserDto.role == '0001'}">

						<a
							th:href="@{/attendance/detail}"
							class="btn btn-default">
							戻る
						</a>

					</th:block>

					<th:block
						th:if="${session.loginUserDto.role != '0001'}">

						<input
							type="submit"
							value="戻る"
							name="indexCompany"
							class="btn btn-default" />

					</th:block>

					<input
						type="submit"
						value="更新"
						name="complete"
						class="btn btn-info" />

				</div>

			</form>

		</div>
	</div>


	<!-- Task28 二子石万葉 定時ボタン押下処理 -->
	<script>

		document.addEventListener(
			'DOMContentLoaded',
			function() {

				const defaultButtons =
					document.querySelectorAll(
						'.default-button');

				defaultButtons.forEach(
					function(button) {

						button.addEventListener(
							'click',
							function() {

								/*
								 * 押下した定時ボタンと
								 * 同じ行を取得
								 */
								const row =
									this.closest('tr');

								if (row == null) {
									return;
								}

								/*
								 * 出勤時間 09:00
								 */
								const startHour =
									row.querySelector(
										'select[name$=".trainingStartTimeHour"]');

								const startMinute =
									row.querySelector(
										'select[name$=".trainingStartTimeMinute"]');

								if (startHour != null) {
									startHour.value = '9';
								}

								if (startMinute != null) {
									startMinute.value = '0';
								}

								/*
								 * 退勤時間 18:00
								 */
								const endHour =
									row.querySelector(
										'select[name$=".trainingEndTimeHour"]');

								const endMinute =
									row.querySelector(
										'select[name$=".trainingEndTimeMinute"]');

								if (endHour != null) {
									endHour.value = '18';
								}

								if (endMinute != null) {
									endMinute.value = '0';
								}

							});

					});

			});

	</script>

</body>

</html>
